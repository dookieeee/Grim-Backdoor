name: Build & Upload Incremental Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_RELEASES: 10

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Generate release tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Incremental Release ${tag}`,
              prerelease: true
            });
            return release.data.id;
          result-encoding: string
        continue-on-error: false

  build-paper:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Paper 1.20.1
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.20.1 --configure-on-demand
        continue-on-error: true
      - name: Upload artifact to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-spigot:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Spigot 1.20.1
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.20.1 --configure-on-demand
        continue-on-error: true
      - name: Upload artifact to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-fabric:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Fabric 1.20.4
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.20.4 --configure-on-demand
        continue-on-error: true
      - name: Upload artifact to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
