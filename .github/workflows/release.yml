name: Build Everything & Upload to Single Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# ---------------- CREATE SINGLE RELEASE ----------------
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Generate release tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `All Builds Release ${tag}`,
              prerelease: true
            });
            return release.data.id;
          result-encoding: string

# ---------------- BUILD JOB TEMPLATE ----------------

  build-paper:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.18,1.18.1,1.19,1.19.2,1.20.1,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Paper ${{ matrix.mc }}
        run: ./gradlew build -Pplatform=paper -PmcVersion=${{ matrix.mc }} --configure-on-demand
        continue-on-error: true
      - name: Upload Paper ${{ matrix.mc }}
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-spigot:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.18,1.18.1,1.19,1.19.2,1.20.1,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Spigot ${{ matrix.mc }}
        run: ./gradlew build -Pplatform=spigot -PmcVersion=${{ matrix.mc }} --configure-on-demand
        continue-on-error: true
      - name: Upload Spigot ${{ matrix.mc }}
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-fabric:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.20.4,1.20.6,1.21,1.21.1,1.21.11] # only versions Fabric supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Fabric ${{ matrix.mc }}
        run: ./gradlew build -Pplatform=fabric -PmcVersion=${{ matrix.mc }} --configure-on-demand
        continue-on-error: true
      - name: Upload Fabric ${{ matrix.mc }}
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
