name: Build Everything (Ultra Reliable)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:

# ---------------- CREATE RELEASE ----------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Generate tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Auto Build ${{ steps.tag.outputs.tag }}" \
            --notes "Building..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------- COMMON BUILD FUNCTION ----------------
  build-paper:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.18,1.18.2,1.19,1.19.4,1.20.1,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.11]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install gh
        run: sudo apt-get install gh -y

      - name: Build Paper
        run: |
          set +e
          ./gradlew build -Pplatform=paper -PmcVersion=${{ matrix.mc }} --no-daemon --configure-on-demand
          set -e

      - name: Process + Upload
        run: |
          FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
          [ -f "$FILE" ] || exit 0

          NAME="Grim-Paper-${{ matrix.mc }}.jar"
          cp "$FILE" "$NAME"

          # checksum
          sha256sum "$NAME" > "$NAME.sha256"
          HASH=$(cut -d ' ' -f1 "$NAME.sha256")

          # check duplicates
          if gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' | grep -q "$HASH"; then
            echo "Duplicate detected, skipping"
            exit 0
          fi

          # random delay to avoid collisions
          sleep $((RANDOM % 10))

          # retry upload
          for i in 1 2 3 4 5; do
            echo "Upload attempt $i"
            gh release upload "${{ needs.create-release.outputs.tag }}" "$NAME" "$NAME.sha256" --clobber && break
            sleep 5
          done

          echo "Paper ${{ matrix.mc }}" >> built.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-spigot:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.18,1.18.2,1.19,1.19.4,1.20.1,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.11]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install gh
        run: sudo apt-get install gh -y

      - name: Build Spigot
        run: |
          set +e
          ./gradlew build -Pplatform=spigot -PmcVersion=${{ matrix.mc }} --no-daemon --configure-on-demand
          set -e

      - name: Process + Upload
        run: |
          FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
          [ -f "$FILE" ] || exit 0

          NAME="Grim-Spigot-${{ matrix.mc }}.jar"
          cp "$FILE" "$NAME"

          sha256sum "$NAME" > "$NAME.sha256"
          HASH=$(cut -d ' ' -f1 "$NAME.sha256")

          if gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' | grep -q "$HASH"; then
            echo "Duplicate detected, skipping"
            exit 0
          fi

          sleep $((RANDOM % 10))

          for i in 1 2 3 4 5; do
            gh release upload "${{ needs.create-release.outputs.tag }}" "$NAME" "$NAME.sha256" --clobber && break
            sleep 5
          done

          echo "Spigot ${{ matrix.mc }}" >> built.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-fabric:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.20.4,1.20.6,1.21,1.21.1,1.21.11]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install gh
        run: sudo apt-get install gh -y

      - name: Build Fabric
        run: |
          set +e
          ./gradlew build -Pplatform=fabric -PmcVersion=${{ matrix.mc }} --no-daemon --configure-on-demand
          set -e

      - name: Process + Upload
        run: |
          FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
          [ -f "$FILE" ] || exit 0

          NAME="Grim-Fabric-${{ matrix.mc }}.jar"
          cp "$FILE" "$NAME"

          sha256sum "$NAME" > "$NAME.sha256"
          HASH=$(cut -d ' ' -f1 "$NAME.sha256")

          if gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' | grep -q "$HASH"; then
            echo "Duplicate detected, skipping"
            exit 0
          fi

          sleep $((RANDOM % 10))

          for i in 1 2 3 4 5; do
            gh release upload "${{ needs.create-release.outputs.tag }}" "$NAME" "$NAME.sha256" --clobber && break
            sleep 5
          done

          echo "Fabric ${{ matrix.mc }}" >> built.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------- FINALIZE RELEASE ----------------
  finalize:
    needs: [build-paper, build-spigot, build-fabric]
    runs-on: ubuntu-latest
    steps:
      - name: Install gh
        run: sudo apt-get install gh -y

      - name: Update release notes
        run: |
          echo "## Built Versions" > notes.md
          echo "" >> notes.md

          gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' >> notes.md

          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --notes-file notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
