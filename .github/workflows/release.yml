name: Build Fabric Only

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: artifacts

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: fabric-builds
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build all Fabric versions
        run: |
          mkdir -p $BUILD_DIR
          for MC in 1.20.4 1.20.6 1.21 1.21.1 1.21.11; do
            echo "Building Fabric $MC"
            ./gradlew build -Pplatform=fabric -PmcVersion=$MC --configure-on-demand || echo "Build failed for $MC, continuing"
            FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
            if [ -f "$FILE" ]; then
              cp "$FILE" "$BUILD_DIR/GrimAnticheat-Fabric-$MC.jar"
            fi
          done

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-builds
          path: $BUILD_DIR/*.jar

  release:
    needs: build-fabric
    runs-on: ubuntu-latest
    steps:
      - name: Download Fabric artifacts
        uses: actions/download-artifact@v4
        with:
          name: fabric-builds
          path: builds

      - name: Generate version tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="fabric-auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Fabric Release ${{ steps.tag.outputs.tag }}
          files: builds/*.jar
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
