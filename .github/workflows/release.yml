name: Build GrimAnticheat

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_RELEASES: 10
  BUILD_DIR: artifacts

jobs:
  # ================= BUILD JOB =================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- Paper builds (Java 17) ----------------
      - name: Setup Java 17 for Paper
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Paper 1.20.1
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.20.1

      - name: Build Paper 1.20.4
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.20.4

      - name: Build Paper 1.20.5
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.20.5

      - name: Build Paper 1.20.6
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.20.6

      - name: Build Paper 1.21
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.21

      - name: Build Paper 1.21.1
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.21.1

      - name: Build Paper 1.21.11
        run: ./gradlew build -Pplatform=paper -PmcVersion=1.21.11

      # ---------------- Spigot builds (Java 17) ----------------
      - name: Setup Java 17 for Spigot
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spigot 1.20.1
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.20.1

      - name: Build Spigot 1.20.4
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.20.4

      - name: Build Spigot 1.20.5
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.20.5

      - name: Build Spigot 1.20.6
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.20.6

      - name: Build Spigot 1.21
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.21

      - name: Build Spigot 1.21.1
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.21.1

      - name: Build Spigot 1.21.11
        run: ./gradlew build -Pplatform=spigot -PmcVersion=1.21.11

      # ---------------- Fabric builds (Java 21) ----------------
      - name: Setup Java 21 for Fabric
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Fabric 1.20.4
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.20.4

      - name: Build Fabric 1.20.6
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.20.6

      - name: Build Fabric 1.21
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.21

      - name: Build Fabric 1.21.1
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.21.1

      - name: Build Fabric 1.21.11
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.21.11

      # ---------------- Artifact collection ----------------
      - name: Collect artifacts
        run: |
          mkdir -p $BUILD_DIR
          find . -name "*.jar" ! -name "*original*" | while read FILE; do
            BASE=$(basename "$FILE")
            if [[ "$BASE" =~ (paper|spigot|fabric) ]]; then
              PLATFORM="${BASH_REMATCH[1]}"
            else
              PLATFORM="unknown"
            fi
            if [[ "$BASE" =~ (1\.20\.1|1\.20\.4|1\.20\.5|1\.20\.6|1\.21|1\.21\.1|1\.21\.11) ]]; then
              MC="${BASH_REMATCH[1]}"
            else
              MC="unknown"
            fi
            cp "$FILE" "$BUILD_DIR/GrimAnticheat-${PLATFORM}-${MC}.jar"
          done

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: $BUILD_DIR/*.jar

      # ---------------- Optional static analysis / lint ----------------
      - name: Run lint checks
        run: ./gradlew check

      - name: Run dependency check
        run: ./gradlew dependencyCheckAnalyze || true

  # ================= RELEASE JOB =================
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: builds
          path: builds

      - name: Generate version tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Auto Release ${{ steps.tag.outputs.tag }}
          files: builds/*.jar
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: ${{ env.MAX_RELEASES }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- Optional notifications ----------------
      - name: Notify Slack (placeholder)
        if: failure()
        run: echo "Notify team: build/release failed!" 
