name: Build Valid Grasps

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_RELEASES: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Detect valid builds
        id: detect
        run: |
          echo "::group::Build matrix entries"
          MATRIX=$(jq -c '.[]' <<'EOF'
[
  {"platform":"paper","mc":"1.20.1"},
  {"platform":"paper","mc":"1.20.4"},
  {"platform":"paper","mc":"1.20.5"},
  {"platform":"paper","mc":"1.20.6"},
  {"platform":"paper","mc":"1.21"},
  {"platform":"paper","mc":"1.21.1"},
  {"platform":"paper","mc":"1.21.11"},
  {"platform":"spigot","mc":"1.20.1"},
  {"platform":"spigot","mc":"1.20.4"},
  {"platform":"spigot","mc":"1.20.5"},
  {"platform":"spigot","mc":"1.20.6"},
  {"platform":"spigot","mc":"1.21"},
  {"platform":"spigot","mc":"1.21.1"},
  {"platform":"spigot","mc":"1.21.11"},
  {"platform":"fabric","mc":"1.20.4"},
  {"platform":"fabric","mc":"1.20.6"},
  {"platform":"fabric","mc":"1.21"},
  {"platform":"fabric","mc":"1.21.1"},
  {"platform":"fabric","mc":"1.21.11"}
]
EOF
)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Dynamic build loop
        run: |
          echo "${{ steps.detect.outputs.matrix }}" | jq -c '.[]' | while read obj; do
            PL=$(jq -r '.platform' <<< "$obj")
            MC=$(jq -r '.mc' <<< "$obj")

            echo ">>> Building $PL for Minecraft $MC"

            if [ -f "pom.xml" ]; then
              mvn clean package -Dmc.version=$MC -Dplatform=$PL -DskipTests
            elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
              chmod +x gradlew || true
              ./gradlew build -PmcVersion=$MC -Pplatform=$PL
            else
              echo "No build system found!"
              exit 1
            fi

            mkdir -p artifacts
            FILE=$(find . -name "*.jar" | grep -v "original" | head -n1)
            NAME="GrimAnticheat-${PL}-${MC}.jar"
            cp "$FILE" "artifacts/$NAME"
          done

        shell: bash

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: artifacts/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: builds
          path: builds

      - name: Version name
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Auto Release ${{ steps.tag.outputs.tag }}
          files: builds/*.jar
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: ${{ env.MAX_RELEASES }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
