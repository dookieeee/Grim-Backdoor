name: Build All Platforms with Gradle Cache

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: artifacts
  MAX_RELEASES: 10

jobs:
  # ---------------- PAPER ----------------
  build-paper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: [1.18.2, 1.19.4, 1.20.1, 1.20.4, 1.20.5, 1.20.6, 1.21, 1.21.1, 1.21.11]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-paper-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-paper-${{ matrix.mc }}-
      - name: Build Paper ${{ matrix.mc }}
        run: |
          mkdir -p $BUILD_DIR
          set +e
          ./gradlew build -Pplatform=paper -PmcVersion=${{ matrix.mc }} --configure-on-demand
          set -e
          FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
          if [ -f "$FILE" ]; then
            cp "$FILE" "$BUILD_DIR/GrimAnticheat-Paper-${{ matrix.mc }}.jar"
          else
            echo "Paper ${{ matrix.mc }} build failed, skipping artifact"
          fi
      - name: Upload Paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-builds
          path: $BUILD_DIR/*.jar

  # ---------------- SPIGOT ----------------
  build-spigot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: [1.18.2, 1.19.4, 1.20.1, 1.20.4, 1.20.5, 1.20.6, 1.21, 1.21.1, 1.21.11]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-spigot-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-spigot-${{ matrix.mc }}-
      - name: Build Spigot ${{ matrix.mc }}
        run: |
          mkdir -p $BUILD_DIR
          set +e
          ./gradlew build -Pplatform=spigot -PmcVersion=${{ matrix.mc }} --configure-on-demand
          set -e
          FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
          if [ -f "$FILE" ]; then
            cp "$FILE" "$BUILD_DIR/GrimAnticheat-Spigot-${{ matrix.mc }}.jar"
          else
            echo "Spigot ${{ matrix.mc }} build failed, skipping artifact"
          fi
      - name: Upload Spigot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spigot-builds
          path: $BUILD_DIR/*.jar

  # ---------------- FABRIC ----------------
  build-fabric:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: [1.18.2, 1.19.4, 1.20.4, 1.20.6, 1.21, 1.21.1, 1.21.11]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-fabric-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-fabric-${{ matrix.mc }}-
      - name: Build Fabric ${{ matrix.mc }}
        run: |
          mkdir -p $BUILD_DIR
          set +e
          ./gradlew build -Pplatform=fabric -PmcVersion=${{ matrix.mc }} --configure-on-demand
          set -e
          FILE=$(find . -name "*.jar" ! -name "*original*" | head -n1)
          if [ -f "$FILE" ]; then
            cp "$FILE" "$BUILD_DIR/GrimAnticheat-Fabric-${{ matrix.mc }}.jar"
          else
            echo "Fabric ${{ matrix.mc }} build failed, skipping artifact"
          fi
      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-builds
          path: $BUILD_DIR/*.jar

  # ---------------- RELEASE ----------------
  release:
    needs: [build-paper, build-spigot, build-fabric]
    runs-on: ubuntu-latest
    steps:
      - name: Download Paper artifacts
        uses: actions/download-artifact@v4
        with:
          name: paper-builds
          path: builds
      - name: Download Spigot artifacts
        uses: actions/download-artifact@v4
        with:
          name: spigot-builds
          path: builds
      - name: Download Fabric artifacts
        uses: actions/download-artifact@v4
        with:
          name: fabric-builds
          path: builds
      - name: Generate release tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Auto Release ${{ steps.tag.outputs.tag }}
          files: builds/*.jar
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
