name: Build Fabric Only

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: artifacts
  MAX_RELEASES: 10

jobs:
  build-fabric:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Fabric 1.20.4
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.20.4 --configure-on-demand

      - name: Build Fabric 1.20.6
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.20.6 --configure-on-demand

      - name: Build Fabric 1.21
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.21 --configure-on-demand

      - name: Build Fabric 1.21.1
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.21.1 --configure-on-demand

      - name: Build Fabric 1.21.11
        run: ./gradlew build -Pplatform=fabric -PmcVersion=1.21.11 --configure-on-demand

      - name: Collect artifacts
        run: |
          mkdir -p $BUILD_DIR
          find . -name "*.jar" ! -name "*original*" | while read FILE; do
            BASE=$(basename "$FILE")
            cp "$FILE" "$BUILD_DIR/$BASE"
          done

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: fabric-builds
          path: $BUILD_DIR/*.jar

  release:
    needs: build-fabric
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: fabric-builds
          path: builds

      - name: Generate version tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="fabric-auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Fabric Release ${{ steps.tag.outputs.tag }}
          files: builds/*.jar
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
