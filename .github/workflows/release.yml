name: Grim Ultra Build System

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:

# ---------------- CREATE RELEASE ----------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install gh
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Generate tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d-%H%M')
          HASH=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          TAG="auto-$BRANCH-$DATE-$HASH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Auto Build ${{ steps.tag.outputs.tag }}" \
            --notes "Building..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------- PAPER ----------------
  build-paper:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.18.2,1.19.4,1.20.1,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.11]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: sudo apt-get update && sudo apt-get install gh jq -y

      - name: Build
        run: |
          set +e
          ./gradlew build -Pplatform=paper -PmcVersion=${{ matrix.mc }} --no-daemon --configure-on-demand
          set -e

      - name: Upload
        run: |
          FILE=$(find . -type f -name "*.jar" ! -name "*original*" | head -n1)
          [ -f "$FILE" ] || exit 0

          NAME="Grim-Paper-${{ matrix.mc }}.jar"
          cp "$FILE" "$NAME"

          sha256sum "$NAME" > "$NAME.sha256"
          HASH=$(cut -d ' ' -f1 "$NAME.sha256")

          # check duplicates
          gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' > existing.txt || true

          if grep -q "$HASH" existing.txt; then
            echo "Duplicate, skipping"
            exit 0
          fi

          sleep $((RANDOM % 10))

          for i in 1 2 3 4 5; do
            echo "Upload attempt $i"
            gh release upload "${{ needs.create-release.outputs.tag }}" "$NAME" "$NAME.sha256" --clobber && break
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------- SPIGOT ----------------
  build-spigot:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.18.2,1.19.4,1.20.1,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.11]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update && sudo apt-get install gh jq -y

      - run: |
          set +e
          ./gradlew build -Pplatform=spigot -PmcVersion=${{ matrix.mc }} --no-daemon --configure-on-demand
          set -e

      - run: |
          FILE=$(find . -type f -name "*.jar" ! -name "*original*" | head -n1)
          [ -f "$FILE" ] || exit 0

          NAME="Grim-Spigot-${{ matrix.mc }}.jar"
          cp "$FILE" "$NAME"

          sha256sum "$NAME" > "$NAME.sha256"
          HASH=$(cut -d ' ' -f1 "$NAME.sha256")

          gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' > existing.txt || true

          if grep -q "$HASH" existing.txt; then exit 0; fi

          sleep $((RANDOM % 10))

          for i in 1 2 3 4 5; do
            gh release upload "${{ needs.create-release.outputs.tag }}" "$NAME" "$NAME.sha256" --clobber && break
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------- FABRIC ----------------
  build-fabric:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.20.4,1.20.6,1.21,1.21.1,1.21.11]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install gh jq -y

      - run: |
          set +e
          ./gradlew build -Pplatform=fabric -PmcVersion=${{ matrix.mc }} --no-daemon --configure-on-demand
          set -e

      - run: |
          FILE=$(find . -type f -name "*.jar" ! -name "*original*" | head -n1)
          [ -f "$FILE" ] || exit 0

          NAME="Grim-Fabric-${{ matrix.mc }}.jar"
          cp "$FILE" "$NAME"

          sha256sum "$NAME" > "$NAME.sha256"
          HASH=$(cut -d ' ' -f1 "$NAME.sha256")

          gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' > existing.txt || true

          if grep -q "$HASH" existing.txt; then exit 0; fi

          sleep $((RANDOM % 10))

          for i in 1 2 3 4 5; do
            gh release upload "${{ needs.create-release.outputs.tag }}" "$NAME" "$NAME.sha256" --clobber && break
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------- FINALIZE ----------------
  finalize:
    needs: [build-paper, build-spigot, build-fabric]
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install gh jq -y

      - name: Update release notes
        run: |
          gh release view "${{ needs.create-release.outputs.tag }}" --json assets \
            | jq -r '.assets[].name' > notes.txt

          echo "## Built Files" > final.md
          cat notes.txt >> final.md

          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --notes-file final.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
